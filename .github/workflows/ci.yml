name: Reflectra CI/CD & Automated Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install .

      - name: Verify CLI Command and Version
        run: |
          reflectra --version
          python -m reflectra --version
          python reflectra.py --version

      - name: Verify CLI Help Menu
        run: |
          reflectra --help

      - name: Run Test Suite (Unit & Integration Probing)
        run: |
          python -m pytest tests/test_unit.py tests/test_integration_probe.py -v
